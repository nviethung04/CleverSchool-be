syntax = "proto3";

package prot;

option go_package = "be-Clever School/prot";

message AppConfig {
  bool force_update = 1;
  string host = 2;
  string mode = 3;
  string version = 4;
  string platform = 5;
  string url_video_tutorial = 6;
}

message AppConfigResponse {
  AppConfig app_config = 1;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/app_config.proto
