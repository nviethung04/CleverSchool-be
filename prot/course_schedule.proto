syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

message CourseFamilyMember {
  int64 id = 1;
  string name = 2;
  string object_title = 3;
  int64 program_id = 4;
  string program_name = 5;
  string school_name = 6;
}

message CourseFamilyResponse {
  CourseFamilyMember parent = 1;
  repeated CourseFamilyMember children = 2;
}

message AssignCourseParentRequest {
  int64 course_id = 1;
  int64 parent_course_id = 2;
}

message CourseScheduleActionResponse {
  bool success = 1;
  string message = 2;
  int64 course_id = 3;
  int64 parent_course_id = 4;
  int32 copied_schedules = 5;
}

message CourseFamilySyncRequest {
  int64 course_id = 1;
}

message CourseFamilySyncResponse {
  bool success = 1;
  string message = 2;
  int64 source_course_id = 3;
  repeated int64 synced_course_ids = 4;
  int32 synced_count = 5;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/course_schedule.proto