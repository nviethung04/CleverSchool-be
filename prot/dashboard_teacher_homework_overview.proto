syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

// Dashboard Teacher Homework Overview Stats
message DashboardTeacherHomeworkOverviewStats {
  int64 total_submitted = 1;
  int64 total_scored = 2;
  int64 total_unscored = 3;
  int64 total_no_manual_scoring = 4;
  double completion_rate = 5;
}

message DashboardTeacherHomeworkOverviewStatsRequest {
  int64 start_date = 1;
  int64 end_date = 2;
  int64 course_id = 3;
  int64 homework_id = 4;
}

message DashboardTeacherHomeworkOverviewStatsResponse {
  DashboardTeacherHomeworkOverviewStats overview = 1;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/dashboard_teacher_homework_overview.proto
