syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

// ====== Setting ======
message Setting {
  int64 id = 1;
  string key = 2;
  string name = 3;

  repeated SettingValue values = 4; // array key => value

  bool is_active = 5;
  bool is_internal = 6;

  int64 created_by = 7;
  int64 updated_by = 8;

  string created_at = 9;
  string updated_at = 10;
}

// ====== Value Pair ======
message SettingValue {
  string key = 1;
  string value = 2;
}

// ====== Requests ======
message GetSettingRequest {
  int64 id = 1;
}

message ListSettingsRequest {
  bool include_inactive = 1;
  int32 page = 2;
  int32 limit = 3;
}

message SettingRequest {
  int64 id = 1;
  string key = 2;
  string name = 3;
  repeated SettingValue values = 4; // array key => value
  bool is_active = 5;
  bool is_internal = 6;
}

// ====== ID Request ======
message SettingIDRequest {
  int64 id = 1;
}

// ====== Responses ======
message SettingResponse {
  Setting setting = 1;
  string message = 2;
}

message SettingsResponse {
  repeated Setting settings = 1;
  uint64 total_count = 2;
}
