syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

message Subject {
  int64 id = 1;
  string name = 2;
  string description = 3;
  bool status = 4;
  string created_at = 5;
  string updated_at = 6;
}

message GetSubjectRequest {
  int64 id = 1;
}

message SubjectResponse {
  Subject subject = 1;
  string message = 2;
}

message ListSubjectsRequest {}

message SubjectRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  bool status = 4;
}

message SubjectIDRequest {
  int64 id = 1;
}

message SubjectsResponse {
  repeated Subject subjects = 1;
  uint64 total_count = 2;
}
