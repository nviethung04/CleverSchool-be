syntax = "proto3";

package prot;

option go_package = "be-Clever School/prot";

message School {
  int64 id = 1;
  string name = 2;
  string short_name = 3;
  string type = 4;
  string ward_code = 5;
  string ward_name = 6;
  string province_code = 7;
  string province_name = 8;
  string address_vn = 9;
  string address_en = 10;
  int64 parent_school_id = 11;
  string contact_name = 12;
  string contact_phone = 13;
  string contact_mail = 14;
  string created_at = 15;
  string updated_at = 16;
  bool status = 17;
  string logo = 18;
  int32 class_count = 19;
  int32 student_count = 20;
}

message SchoolRequest {
  string name = 1;
  string short_name = 2;
  string type = 3;
  string ward_code = 4;
  string address_vn = 5;
  string address_en = 6;
  int64 parent_school_id = 7;
  string contact_name = 8;
  string contact_phone = 9;
  string contact_mail = 10;
  int64 id = 11;
  bool status = 12;
  string logo = 13;
}

message SchoolListResponse {
  repeated School schools = 1;
  int64 total_count = 2;
}
//protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative school.proto
