syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

message ExamCommentRequest {
  int64 exam_id = 1;
  int64 student_id = 2;
  string content = 3;
}

message ExamCommentResponse {
  bool success = 1;
  string message = 2;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/exam_comment.proto
