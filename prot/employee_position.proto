syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

message EmployeePosition {
  int64 id = 1;
  string name = 2;
  string level = 3;
  string description = 4;
  string created_at = 5;
  string updated_at = 6;
  bool status = 7;
}

message EmployeePositionListResponse {
  repeated EmployeePosition employee_positions = 1;
  int64 total_count = 2;
}
//protoc --go_out=. --go_opt=paths=source_relative prot/employee_position.proto
