syntax = "proto3";

package prot;

option go_package = "be-Clever School/prot";

message ExerciseFile {
  string type = 1;
  string url = 2;
}

message Exercise {
  int64 id = 1;
  string name = 2;
  int32 status = 3;
  int64 time_limit = 4;
  float max_score = 5;
  string description = 6;
  string cover_image = 7;
  int64 created_at = 8;
  int64 created_by = 9;
  int64 updated_at = 10;
  int64 updated_by = 11;
  int64 deadline = 12;
  bool is_assigned = 13;
  int32 total_questions = 14;
  string object_title = 15;
  bool is_random_question = 16;
  string question_form = 17;
  repeated ExerciseFile question_files = 18;
}

message ExerciseRequest {
  int64 id = 1;
  string name = 2;
  int32 status = 3;
  int64 time_limit = 4;
  float max_score = 5;
  string description = 6;
  string cover_image = 7;
  int64 deadline = 8;
  bool is_assigned = 9;
  int32 total_questions = 10;
  string object_title = 11;
  bool is_random_question = 12;
  string question_form = 13;
  repeated ExerciseFile question_files = 14;
}

message ExerciseListResponse {
  repeated Exercise exercises = 1;
  int64 total = 2;
}

message ClonedExerciseRequest {
  int64 lesson_id = 1;
  string name = 2;
  string description = 3;
}

message AssignedExercise {
  int64 lesson_id = 1;
  int64 course_id = 2;
  bool is_assigned = 3;
}

message ExerciseByCourse {
  repeated Exercise exercises = 1;
  repeated Exercise exercise_by_programs = 2;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/exercise.proto
