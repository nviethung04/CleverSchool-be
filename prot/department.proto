syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

message Department {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string created_at = 4;
  string updated_at = 5;
  bool status = 6;
}

message DepartmentListResponse {
  repeated Department departments = 1;
  int64 total_count = 2;
}
//protoc --go_out=. --go_opt=paths=source_relative prot/department.proto
