syntax = "proto3";

package prot;

option go_package = "be-cleverschool/admin/prot";

message Media {
  int64 id = 1;
  int64 parent_id = 2;
  string file_name = 3;
  string file_path = 4;
  string file_type = 5;
  int64 file_size = 6;
  string file_extension = 7;
  string c = 8;
  string url = 9;
  string type = 10;
}

message File {
  int32 id = 1;
  string file_name = 2;
  string url = 3;
  string file_size = 4;
  string file_mime_type = 5;
  string file_extension = 6;
  string disk_name = 7;
  string type = 8;
  string path = 9;
}

message MediaTree {
  int64 id = 1;
  int64 parent_id = 2;
  string path = 3;
  string full_path = 4;
  string disk_name = 5;
  repeated MediaTree children = 6;
}

message FileResponse {
    repeated File files = 1;
    uint64 total_count = 2;
}

