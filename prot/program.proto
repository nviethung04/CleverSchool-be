syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

import "course.proto";
import "subject.proto";
import "chapter.proto";

message Program {
  int64 id = 1;
  int64 subject_id = 2;
  string name = 3;
  string description = 4;
  string image = 5;
  bool status = 6;
  string target = 7;
  Subject subject = 8;
  repeated Course courses = 9;
  repeated Chapter chapters = 10;
  int32 duration = 11;
  int32 current_students = 12;
  string created_at = 13;
  string updated_at = 14;
}

message ProgramRequest {
  int64 id = 1;
  string name = 2;
  string description = 3;
  bool status = 4;
  int64 subject_id = 5;
  string target = 6;
  string image = 7;
  int32 duration = 8;
}

message ProgramsResponse {
  repeated Program programs = 1;
  uint64 total_count = 2;
}

message ReSyncProgram {
  int64 course_id = 1;
  repeated int64 course_ids = 2;
}
