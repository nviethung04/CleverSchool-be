syntax = "proto3";

package prot;

option go_package = "be-Clever School/prot";

// Active users count
message ActiveUsersCountResponse {
  int64 total_active_users = 1;
  string time_range = 2;
  string timestamp = 3;
}

// Active user info
message ActiveUserInfo {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string username = 4;
  string online_duration = 5;
  string last_activity_time = 6;
}

// Active users list
message ActiveUsersListResponse {
  repeated ActiveUserInfo users = 1;
  int64 total_active_users = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 total_pages = 5;
  string time_range = 6;
  string timestamp = 7;
}

// Failed logins count
message FailedLoginsCountResponse {
  int64 total_failed_logins = 1;
  string time_range = 2;
  string timestamp = 3;
}

// Failed login info
message FailedLoginInfo {
  int32 user_id = 1; // nullable int
  int32 role_id = 2; // nullable int
  string client_ip = 3; // IP address
  string query_params = 4;
  string request_body = 5;
  string response_body = 6;
  string created_at = 7; // ISO string
}

// Failed logins list
message FailedLoginsListResponse {
  repeated FailedLoginInfo failed_logins = 1;
  int64 total_failed_logins = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 total_pages = 5;
  string time_range = 6;
  string timestamp = 7;
}
