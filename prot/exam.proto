syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

message ExamFile {
  string type = 1;
  string url = 2;
}

message Exam {
  int64 id = 1;
  string name = 2;
  int64 lesson_id = 3;
  int32 status = 4;
  int64 time_limit = 5;
  float max_score = 6;
  string description = 7;
  string cover_image = 8;
  int64 created_at = 9;
  int64 created_by = 10;
  int64 updated_at = 11;
  int64 updated_by = 12;
  int64 deleted_at = 13;
  int64 deleted_by = 14;
  int64 deadline = 15;
  bool is_assigned = 16;
  bool is_random_question = 17;
  int32 total_questions = 18;
  string object_title = 19;
  string question_form = 20;
  repeated ExamFile question_files = 21;
}

message ExamRequest {
  int64 id = 1;
  string name = 2;
  int64 lesson_id = 3;
  int32 status = 4;
  int64 time_limit = 5;
  float max_score = 6;
  string description = 7;
  string cover_image = 8;
  int64 created_at = 9;
  int64 created_by = 10;
  int64 updated_at = 11;
  int64 updated_by = 12;
  int64 deleted_at = 13;
  int64 deleted_by = 14;
  int64 deadline = 15;
  bool is_assigned = 16;
  int32 total_questions = 17;
  string object_title = 18;
  bool is_random_question = 19;
  string question_form = 20;
  repeated ExamFile question_files = 21;
}

message ExamListResponse {
  repeated Exam exams = 1;
  int64 total = 2;
}

message ClonedExamRequest {
  int64 lesson_id = 1;
  string name = 2;
  string description = 3;
}

message AssignedExam {
  int64 lesson_id = 1;
  int64 course_id = 2;
  bool is_assigned = 3;
}

message ExamByCourse {
  repeated Exam exams = 1;
  repeated Exam exam_by_programs = 2;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/exam.proto
