syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

message ExamStudentItem {
  int64 user_id = 1;
  string name = 2;
  string username = 3;
  string avatar = 4;
  bool is_submitted = 5;
  int64 submitted_at = 6;
  int64 duration = 7;
  int32 unscored_count = 8;
  double score = 9;
  double ratio = 10;
  string comment = 11;
  int64 course_id = 12;
}

message ExamStudentExamInfo {
  string name = 1;
  string description = 2;
  bool is_assigned = 3;
  int32 status = 4;
  double max_score = 5;
  int64 time_limit = 6;
  int64 created_at = 7;
  int64 deadline = 8;
  int64 total_questions = 9;
  int64 total_students = 10;
  int64 submitted_students = 11;
  int64 graded_students = 12;
  double avg_score = 13;
}

message ExamStudentResponseWithCount {
  ExamStudentExamInfo exam_info = 1;
  repeated ExamStudentItem students = 2;
  int64 total_count = 3;
}

message GetExamByStudentExam {
  int64 id = 1;
  string name = 2;
  int32 status = 3;
  string description = 4;
  string cover_image = 5;
  int64 deadline = 6;
  bool is_submitted = 7;
  int32 unscored_count = 8;
  string type = 9;
}

message GetExamByStudentHomework {
  int64 id = 1;
  string name = 2;
  int32 status = 3;
  string description = 4;
  int32 total_question = 5;
  int32 question_completed = 6;
  string cover_image = 7;
  int64 last_question_id_completed = 8;
  string question_form = 9;
  bool is_submitted = 10;
}

message GetExamByStudentExercise {
  int64 id = 1;
  string name = 2;
  int32 status = 3;
  string description = 4;
  string cover_image = 5;
  int64 deadline = 6;
  bool is_submitted = 7;
  int32 unscored_count = 8;
  int32 total_question = 9;
}

message GetExamByStudentLesson {
  int64 id = 1;
  string title = 2;
  string description = 3;
  bool status = 4;
  repeated GetExamByStudentExam exams = 5;
  repeated GetExamByStudentHomework homeworks = 6;
  repeated GetExamByStudentExercise exercises = 7;
}

message GetExamByStudentCourse {
  int64 id = 1;
  string name = 2;
  string description = 3;
  bool status = 4;
  string subject_name = 5;
  string type = 6;
  string image = 7;
  string level = 8;
  string target = 9;
  repeated GetExamByStudentLesson lessons = 10;
}

message GetExamByStudentResponse {
  repeated GetExamByStudentCourse courses = 1;
  int64 total = 2;
}

message GetExamByStudentByCourseResponse {
  GetExamByStudentCourse course = 1;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/exam_student.proto
