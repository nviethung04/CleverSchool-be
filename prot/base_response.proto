syntax = "proto3";

package prot;

option go_package = "be-Clever School/prot";

import "google/protobuf/any.proto";

message BaseResponse {
  int32 code    = 1;
  string message = 2;
  google.protobuf.Any data   = 3;
  string error = 4; // thêm field lỗi nếu có
}

