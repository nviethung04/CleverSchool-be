syntax = "proto3";

package prot;

option go_package = "be-Clever School/prot";

// Copy Lesson Schedule Request
message CopyLessonScheduleRequest {
  int64 source_course_id = 1;
  int64 target_course_id = 2;
}

// Copy Lesson Schedule Response
message CopyLessonScheduleResponse {
  bool success = 1;
  string message = 2;
  int32 copied_schedules_count = 3;
}

