syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

// Dashboard Teacher Homework List Item
message DashboardTeacherHomeworkListItem {
  int64 homework_id = 1;
  string homework_name = 2;
  int64 total_questions = 3;
  int64 questions_completed = 4;
  string status = 5; // "completed", "in_progress", "not_started"
  int64 submitted_at = 6; // Unix timestamp từ homework_users.updated_at
  int64 lesson_id = 7;
  string lesson_name = 8;
  bool assign_late = 9;
  int64 assigned_at = 10; // Unix timestamp từ homework_ref_lessons.assigned_at
}

message DashboardTeacherHomeworkListResponse {
  repeated DashboardTeacherHomeworkListItem homeworks = 1;
  int64 total = 2;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/dashboard_teacher_homework_list.proto


