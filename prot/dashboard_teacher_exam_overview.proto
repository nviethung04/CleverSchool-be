syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

// Dashboard Teacher Exam Overview
message DashboardTeacherExamOverview {
  int64 total_submitted = 1;
  int64 total_scored = 2;
  int64 total_unscored = 3;
  double completion_rate = 4;
}

message DashboardTeacherExamOverviewRequest {
  int64 start_date = 1;
  int64 end_date = 2;
  int64 course_id = 3;
  int64 exam_id = 4;
}

message DashboardTeacherExamOverviewResponse {
  DashboardTeacherExamOverview overview = 1;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/dashboard_teacher_exam_overview.proto 
