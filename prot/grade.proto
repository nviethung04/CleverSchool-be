syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

message Grade {
  int64 id = 1;
  int32 number = 2;
  string name_vn = 3;
  string name_en = 4;
  string created_at = 5;
  string updated_at = 6;
}

message GetGradeRequest {
  int64 id = 1;
}

message GradeResponse {
  Grade grade = 1;
  string message = 2;
}

message ListGradesRequest {}

message GradeRequest {
  int64 id = 1;
  int32 number = 2;
  string name_vn = 3;
  string name_en = 4;
}

message GradeIDRequest {
  int64 id = 1;
}

message GradesResponse {
  repeated Grade grades = 1;
  uint64 total_count = 2;
}
