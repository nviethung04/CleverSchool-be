syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

// Dashboard Teacher Homework Unscored
message DashboardTeacherHomeworkUnscored {
  int64 user_id = 1;
  int64 homework_id = 2;
  int64 course_id = 3;
  int64 lesson_id = 4;
  string student_name = 5;
  string course_name = 6;
  string subject_name = 7;
  string homework_name = 8;
  string lesson_title = 9;
  int64 submitted_at = 10;
  double ratio = 11;
  int32 total_questions = 12;
  int32 unscored_questions = 13;
  int32 manual_questions = 14;
  bool has_comment = 15;
  string comment_content = 16;
  string object_title = 17;
}

message DashboardTeacherHomeworkUnscoredListRequest {
  int32 page = 1;
  int32 limit = 2;
  map<string, string> sort = 3;
  int64 start_date = 4;
  int64 end_date = 5;
  int64 course_id = 6;
  int64 homework_id = 7;
}

message DashboardTeacherHomeworkUnscoredListResponse {
  repeated DashboardTeacherHomeworkUnscored homeworks = 1;
  int64 total = 2;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/dashboard_teacher_homework_unscored.proto

