syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

message LessonPlanPart {
  int64 id = 1;
  int64 lesson_plan_id = 2;
  string title = 3;
  string tag = 4;
  string cover_image = 5;
  int32 sort_position = 6;
  int64 time = 7;
  bool is_classwork = 8;
  string file_type = 9;
  string link = 10;
  string link_type = 11;
  string guide_teacher = 12;
  string guide_student = 13;
  int64 created_at = 14;
  int64 created_by = 15;
  int64 updated_at = 16;
  int64 updated_by = 17;
  string file = 18;
  string object_title = 19;
  int64 course_id = 20;
  bool is_program = 21;
}

message LessonPlanPartRequest {
  int64 id = 1;
  int64 lesson_plan_id = 2;
  string title = 3;
  string tag = 4;
  string cover_image = 5;
  int32 sort_position = 6;
  int64 time = 7;
  bool is_classwork = 8;
  string file_type = 9;
  string link = 10;
  string link_type = 11;
  string guide_teacher = 12;
  string guide_student = 13;
  int64 created_at = 14;
  int64 created_by = 15;
  int64 updated_at = 16;
  int64 updated_by = 17;
  string file = 18;
  float max_score = 19;
  string object_title = 20;
  int64 course_id = 21;
}

message LessonPlanPartListResponse {
  repeated LessonPlanPart parts = 1;
  int64 total = 2;
}


//protoc --go_out=. --go_opt=paths=source_relative prot/lesson_plan_part.proto

