syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

message Province {
  string code = 1;
  string name = 2;
  string full_name = 3;
}

message ProvinceResponse {
  Province province = 1;
  string message = 2;
}

message ProvincesResponse {
  repeated Province provinces = 1;
  uint64 total_count = 2;
}

message Ward {
  string code = 1;
  string province_code = 2;
  string name = 3;
  string full_name = 4;
}

message WardsResponse {
  repeated Ward wards = 1;
  uint64 total_count = 2;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/province.proto
