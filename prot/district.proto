syntax = "proto3";

package prot;

option go_package = "be-Clever School/prot";

message District {
  string code = 1;
  string name = 2;
  string full_name = 3;
  string province_code = 4;
}

message DistrictsResponse {
  repeated District districts = 1;
  uint64 total_count = 2;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/district.proto