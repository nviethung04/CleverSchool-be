syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

message DashboardStudentHomeworkListRequest {
    int64 course_id = 1;
    int64 start_date = 2;
    int64 end_date = 3;
    int32 limit = 4;
    int32 page = 5;
}

message DashboardStudentHomeworkListItem {
    int64 id = 1;
    string name = 2;
    string description = 3;
    string cover_image = 4;
    int64 created_at = 5;
    bool is_submitted = 6;
    int32 total_questions = 7;
    int32 questions_completed = 8;
    int32 week = 9;
    int32 year = 10;
    int64 week_start_date = 11;
    int64 week_end_date = 12;
    int64 course_id = 13;
    string course_name = 14;
    int64 lesson_id = 15;
    string lesson_title = 16;
    double ratio = 17;
    int32 skip_questions_count = 18;
    int64 assigned_at = 19;
    string question_form = 20;
    string rate = 21;
}

message DashboardStudentHomeworkListResponse {
    repeated DashboardStudentHomeworkListItem homeworks = 1;
    int64 total = 2;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/dashboard_student_homework_list.proto
