syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

// Dashboard Exam Ranking
message DashboardExamRanking {
  int64 student_id = 1;
  string student_name = 2;
  double average_ratio = 3;
  double average_time = 4;       // Thời gian trung bình (giây)
  string avatar = 5;             // URL ảnh đại diện
  int64 number_exams = 6;        // Số bài kiểm tra đã làm
}

message ExamScoreDistribution {
  string score_range = 1;
  int64 student_count = 2;
}

// Dashboard Exam Ranking Response
message DashboardExamRankingResponse {
  repeated DashboardExamRanking students = 1;
  int64 total = 2;
  repeated ExamScoreDistribution score_chart = 3;
  int64 current_ranking = 4;  // Thứ tự xếp hạng hiện tại của học sinh (chỉ trả về khi là học sinh)
}

//protoc --go_out=. --go_opt=paths=source_relative prot/dashboard_exam_ranking.proto 
