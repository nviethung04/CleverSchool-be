syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

// Dùng chung cho cả homework ranking và assessment ranking
message RankingStudentItem {
  int64 id = 1;
  string name = 2;
  string avatar = 3;
  string class = 4;
  int32 star = 5;
  int32 rank = 6;
  bool is_me = 7;
  double score = 8;  // assessment ranking
  double exp = 9;     // homework ranking
}

message RankingListResponse {
  repeated RankingStudentItem students = 1;
  int64 total = 2;
}
//protoc --go_out=. --go_opt=paths=source_relative prot/ranking.proto
