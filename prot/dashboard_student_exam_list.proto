syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

message DashboardStudentExamListRequest {
    int64 course_id = 1;
    int64 start_date = 2;
    int64 end_date = 3;
    int32 limit = 4;
    int32 page = 5;
}

message DashboardStudentExamListItem {
    int64 id = 1;
    string name = 2;
    string description = 3;
    string cover_image = 4;
    int64 deadline = 5;
    bool is_submitted = 6;
    int32 unscored_count = 7;
    double ratio = 8;
    int64 duration = 9;
    int64 created_at = 10;
    int32 week = 11;
    int32 year = 12;
    int64 week_start_date = 13;
    int64 week_end_date = 14;
    string course_name = 15;
    string lesson_title = 16;
}

message DashboardStudentExamListResponse {
    repeated DashboardStudentExamListItem exams = 1;
    int64 total = 2;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/dashboard_student_exam_list.proto