syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

// Định nghĩa message ScormData
message Scorm {
  int64 id = 1;
  string user_id = 2;
  string course_id = 3;
  string name = 4;
  string value = 5;
}

// Request tạo ScormData
message CreateScormRequest {
  string user_id = 1;
  string course_id = 2;
  string name = 3;
  string value = 4;
}

// Request cập nhật ScormData
message UpdateScormRequest {
  int64 id = 1;
  string user_id = 2;
  string course_id = 3;
  string name = 4;
  string value = 5;
}

// Request lấy theo ID
message GetScormRequest {
  int64 id = 1;
}

// Response chứa danh sách Scorm
message ScormsResponse {
  repeated Scorm scorms = 1;
}

// Response đơn lẻ
message ScormResponse {
  Scorm scorm = 1;
  string message = 2;
}

