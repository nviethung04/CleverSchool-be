syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

message Certificate {
  int64 id = 1;
  int64 course_id = 2;
  int64 user_id = 3;
  string name = 4;
  string issued_by = 5;
  string issued_date = 6;
  string expiry_date = 7;
  string certificate_code = 8;
  bool status = 9;
  string description = 10;
  string file_url = 11;
  string grade = 12;
  float rating = 13;
  string created_at = 14;
  string updated_at = 15;
}

message CertificateListResponse {
  repeated Certificate certificates = 1;
  int64 total_count = 2;
}
//protoc --go_out=. --go_opt=paths=source_relative prot/certificate.proto
