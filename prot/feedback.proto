syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

message Feedback {
  int64 id = 1;
  int64 user_id = 2;
  string content = 3;
  string title = 4;
  string file_url = 5;
  int64 role_id = 6;
  int64 status = 7;
  string response = 8;
  string note = 9;
  int64 type = 10;
  int64 created_at = 11;
  int64 created_by = 12;
  int64 updated_at = 13;
  int64 updated_by = 14;
  string username = 15;
  string name = 16;
  string role_name = 17;
}

message FeedbackListResponse {
  repeated Feedback feedbacks = 1;
  int64 total = 2;
}

message FeedbackRequest {
  int64 id = 1;
  string content = 2;
  string title = 3;
  string file_url = 4;
  int64 status = 5;
  string response = 6;
  string note = 7;
  int64 type = 8;
}

message UpdateFeedbackStatusRequest {
  int64 status = 1;
  string response = 2;
  string note = 3;
  int64 type = 4;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/feedback.proto

