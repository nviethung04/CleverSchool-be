syntax = "proto3";
package prot;

option go_package = "be-cleverschool/prot";

import "google/protobuf/struct.proto";

message HomeworkAnswerRequest {
  int64 homework_id = 1;
  int64 user_id = 2;
}

message HomeworkAnswerFile {
  string type = 1;
  string url = 2;
}

message HomeworkAnswerOverview {
  string student_name = 1;
  string homework_name = 2;
  string homework_description = 3;
  int32 homework_status = 4;
  string homework_cover_image = 5;
  int32 total_questions = 6;
  int64 questions_completed = 7;
  int64 last_question_id_completed = 8;
  int32 manual_questions_count = 9; // số câu hỏi manual đã làm
  double ratio = 10;                 // tỷ lệ điểm/hoàn thành
  string latest_comment = 11;        // comment mới nhất của giáo viên
  string homework_question_form = 12;
  repeated HomeworkAnswerFile question_files = 13;
}

message ManualAnswer {
  string id = 1;
  string type = 2;
  string source = 3;
  bool status = 4;
  string content = 5;
  string answer = 6;
  string file_url = 7;
  google.protobuf.Struct content_struct = 8;
  // New fields
  bool is_scored = 9;        // đã chấm chưa
  double manual_score = 10;  // điểm chấm tay
}

message HomeworkAnswerResponse {
  HomeworkAnswerOverview overview = 1;
  repeated google.protobuf.Struct questions = 2;
  repeated ManualAnswer manual_answers = 3;
  repeated int64 skipped_question_ids = 4; // danh sách câu hỏi skip của học sinh
  bool is_all_scored = 5; // tất cả câu manual đã được chấm hay chưa
  repeated HomeworkAnswerFile submit_files = 6;
  bool is_submitted = 7;
  bool is_scored = 8;
  string rate = 9;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/homework_answer.proto

