syntax = "proto3";

package prot;

option go_package = "be-cleverschool/prot";

// Class User Relation
message ClassUserRelationRequest {
  int64 class_id = 1;
  repeated int64 student_ids = 2;
}

message ClassUserRelationResponse {
  bool success = 1;
  string message = 2;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/class_user_relation.proto 
