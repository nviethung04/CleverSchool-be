syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

message DashboardTeacherInfo {
  int64 id = 1;
  string username = 2;
  string name = 3;
}

message DashboardReportCourse {
  int64 id = 1;
  int64 course_id = 2;
  string course_name = 3;
  string object_title = 4;  // Thêm object_title từ courses
  int64 school_id = 5;
  string school_name = 6;
  int64 total_students = 7;
  int64 total_teachers = 8;
  string teacher_ids = 9;
  repeated DashboardTeacherInfo teacher_infos = 10;
  int64 active_teachers_from_sep8 = 11;
  int64 active_students_from_sep15 = 12;
  int64 students_completed_homework_from_sep15 = 13;
  int64 students_completed_homework_selected_week = 14;
  int64 active_students_selected_week = 15;
  int64 active_teachers_selected_week = 16;
  int64 total_homeworks = 17;      // Tổng số homework từ 15/9/2025 đến hiện tại
  int64 assigned_homeworks = 18;   // Số homework đã giao từ 15/9/2025 đến hiện tại
  int64 completed_homeworks = 19;  // Số homework đã hoàn thành từ 15/9/2025 đến hiện tại
}

message DashboardCoursesRequest {
  int64 school_id = 1; // optional filter by school_id
  string search = 2; // optional search by course_name or school_name
  int32 page = 3; // page number (default: 1)
  int32 limit = 4; // items per page (default: 10)
  string start_date = 5; // selected week start date (format: YYYY-MM-DD)
  string end_date = 6; // selected week end date (format: YYYY-MM-DD)
}

message DashboardCoursesResponse {
  repeated DashboardReportCourse courses = 1;
  int64 total = 2;
  int32 page = 3;
  int32 limit = 4;
  int32 total_pages = 5;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/dashboard_courses.proto
