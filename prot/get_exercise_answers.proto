syntax = "proto3";

package prot;

option go_package = "be-lms/prot";

message GetExerciseAnswersRequest {
  int64 exercise_id = 1;
  int64 user_id = 2;
}

message ExerciseAnswerOverview {
  string student_name = 1;
  int64 duration = 2;
  float total_score = 3;
  int64 submitted_at = 4;
  bool has_manual_scoring = 5;
  int32 total_questions = 6;
  int32 unscored_questions = 7;
  string comment = 8;
  float ratio = 9;
}

message GetExerciseAnswersResponse {
  ExerciseAnswerOverview overview = 1;
  repeated QuestionAnswerExercise questions = 2;
}

message QuestionAnswerExercise {
  int64 id = 1;
  string content = 2;
  string type = 3;
  string file_url = 4;
  string question_kind = 5;
  oneof answer {
    AnswerMultipleChoiceExercise answer_multiple_choice_exercise = 6;
    AnswerFillInBlankExercise answer_fill_in_blank_exercise = 7;
    AnswerPositionExercise answer_position_exercise = 8;
    AnswerMatchingExercise answer_matching_exercise = 9;
    AnswerLabelingExercise answer_labeling_exercise = 10;
    AnswerGroupExercise answer_group_exercise = 11;
    AnswerManualExercise answer_manual_exercise = 12;
  }
}

message AnswerMultipleChoiceExercise {
  repeated int64 all_answer_ids = 1;
  repeated string all_answer_contents = 2;
  repeated string all_answer_file_urls = 3;
  repeated string all_answer_kinds = 4;
  repeated int64 answer_ids = 5;
  repeated string answers = 6;
  repeated string answer_file_urls = 7;
  repeated string answer_kinds = 8;
  repeated int64 true_answer_ids = 9;
  repeated string true_answers = 10;
  repeated string true_answer_file_urls = 11;
  repeated string true_answer_kinds = 12;
  bool is_all_correct = 13;
  float score = 14;
}

message AnswerFillInBlankExercise {
  repeated FillInBlankAnswerExercise answers = 1;
  bool is_all_correct = 2;
}

message FillInBlankAnswerExercise {
  int32 sort_position = 1;
  string answer = 2;
  string true_answer = 3;
  bool is_correct = 4;
  float score = 5;
}

message AnswerPositionExercise {
  repeated PositionAnswerExercise answers = 1;
  bool is_all_correct = 2;
}

message PositionAnswerExercise {
  int32 sort_position = 1;
  int64 answer_group_position = 2;
  string answer_content = 3;
  string answer_file_url = 4;
  string answer_file_kind = 5;
  int64 true_answer_id = 6;
  string true_answer_content = 7;
  string true_answer_file_url = 8;
  string true_answer_file_kind = 9;
  bool is_correct = 10;
  double score = 11;
}

message MatchingPairAnswerExercise {
  int64 first_item_id = 1;
  string first_item_content = 2;
  string first_item_file_url = 3;
  string first_item_kind = 4;
  int64 second_item_id = 5;
  string second_item_content = 6;
  string second_item_file_url = 7;
  string second_item_kind = 8;
  bool is_correct = 9;
  float score = 10;
}

message AnswerMatchingExercise {
  repeated MatchingPairAnswerExercise matches = 1;
  bool is_all_correct = 2;
}

message LabelingAnswerExercise {
  int64 blank_id = 1;
  string true_blank_content = 2;
  string true_blank_file_url = 3;
  string true_blank_kind = 4;
  float blank_position_x = 5;
  float blank_position_y = 6;
  float blank_position_width = 7;
  float blank_position_height = 8;
  int64 answer_id = 9;
  string answer_content = 10;
  string answer_file_url = 11;
  string answer_kind = 12;
  bool is_correct = 13;
  float score = 14;
}

message AnswerLabelingExercise {
  repeated LabelingAnswerExercise answers = 1;
  bool is_all_correct = 2;
}

message AnswerGroupExercise {
  repeated CategoryAnswerExercise groups = 1;
  bool is_all_correct = 2;
}

message CategoryAnswerExercise {
  int64 answer_id = 1;
  int64 group_id = 2;
  string answer_content = 3;
  string group_content = 4;
  string answer_file_url = 5;
  string answer_file_kind = 6;
  string group_file_url = 7;
  string group_file_kind = 8;
  bool is_correct = 9;
  float score = 10;
}

message AnswerManualExercise {
  string answer = 1;
  string answer_file_url = 2;
  string answer_text = 3;
  float score = 4;
  bool is_scored = 5;
}

//protoc --go_out=. --go_opt=paths=source_relative prot/get_exercise_answers.proto
