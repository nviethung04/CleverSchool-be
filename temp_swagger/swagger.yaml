definitions:
  requests.AddVocabularyToLessonRequest:
    properties:
      is_required:
        type: boolean
      sort_order:
        type: integer
      vocabulary_ids:
        items:
          type: integer
        type: array
    required:
    - vocabulary_ids
    type: object
  requests.CreateVocabularyRequest:
    properties:
      definition:
        type: string
      difficulty:
        maximum: 5
        minimum: 1
        type: integer
      example_audio_id:
        type: integer
      example_sentence:
        description: Example
        type: string
      example_translation:
        type: string
      frequency:
        type: integer
      image_id:
        type: integer
      level:
        type: string
      part_of_speech:
        type: string
      phonetic:
        type: string
      tags:
        type: string
      translation:
        type: string
      word:
        type: string
      word_audio_id:
        description: Media IDs
        type: integer
    required:
    - translation
    - word
    type: object
  requests.RecordFlashcardActivityRequest:
    properties:
      activity_type:
        description: view, flip, mark_known, mark_unknown, pronunciation
        type: string
      pronunciation_score:
        type: number
      response:
        type: string
      response_time:
        type: integer
    required:
    - activity_type
    type: object
  requests.StartFlashcardSessionRequest:
    properties:
      lesson_id:
        type: integer
    required:
    - lesson_id
    type: object
  requests.UpdateVocabularyProgressRequest:
    properties:
      is_known:
        type: boolean
      status:
        description: new, learning, known, mastered
        type: string
    type: object
info:
  contact: {}
paths:
  /api/manage/flashcard/lessons/{lessonId}/vocabularies:
    get:
      consumes:
      - application/json
      description: Get flashcards for studying with student progress and filtering
      parameters:
      - description: Lesson ID
        in: path
        name: lessonId
        required: true
        type: integer
      - default: true
        description: Include student progress data
        in: query
        name: include_progress
        type: boolean
      - collectionFormat: csv
        description: Filter by learning status
        in: query
        items:
          enum:
          - new
          - learning
          - known
          - mastered
          type: string
        name: status
        type: array
      - default: false
        description: Shuffle the cards
        in: query
        name: shuffle
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get flashcards for lesson
      tags:
      - Flashcard - Study
    post:
      consumes:
      - application/json
      description: Add multiple vocabularies to a lesson
      parameters:
      - description: Lesson ID
        in: path
        name: lessonId
        required: true
        type: integer
      - description: Vocabularies to add
        in: body
        name: vocabularies
        required: true
        schema:
          $ref: '#/definitions/requests.AddVocabularyToLessonRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Add vocabularies to lesson
      tags:
      - Flashcard - Lesson
  /api/manage/flashcard/sessions:
    post:
      consumes:
      - application/json
      description: Start a new flashcard study session
      parameters:
      - description: Session data
        in: body
        name: session
        required: true
        schema:
          $ref: '#/definitions/requests.StartFlashcardSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Start flashcard session
      tags:
      - Flashcard - Study
  /api/manage/flashcard/sessions/{sessionId}/activities:
    post:
      consumes:
      - application/json
      description: Record an activity during flashcard study (view, flip, mark known,
        pronunciation)
      parameters:
      - description: Session ID
        in: path
        name: sessionId
        required: true
        type: integer
      - description: Vocabulary ID
        in: query
        name: vocabularyId
        required: true
        type: integer
      - description: Activity data
        in: body
        name: activity
        required: true
        schema:
          $ref: '#/definitions/requests.RecordFlashcardActivityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Record flashcard activity
      tags:
      - Flashcard - Study
  /api/manage/flashcard/vocabularies:
    post:
      consumes:
      - application/json
      description: Create a new vocabulary word with media attachments
      parameters:
      - description: Vocabulary data
        in: body
        name: vocabulary
        required: true
        schema:
          $ref: '#/definitions/requests.CreateVocabularyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create new vocabulary
      tags:
      - Flashcard - Vocabulary
  /api/manage/flashcard/vocabularies/{vocabularyId}:
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific vocabulary
      parameters:
      - description: Vocabulary ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get vocabulary by ID
      tags:
      - Flashcard - Vocabulary
  /api/manage/flashcard/vocabulary-progress/{vocabularyId}:
    put:
      consumes:
      - application/json
      description: Update student's progress with a vocabulary (known/unknown status)
      parameters:
      - description: Vocabulary ID
        in: path
        name: vocabularyId
        required: true
        type: integer
      - description: Progress data
        in: body
        name: progress
        required: true
        schema:
          $ref: '#/definitions/requests.UpdateVocabularyProgressRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Update vocabulary progress
      tags:
      - Flashcard - Progress
swagger: "2.0"
