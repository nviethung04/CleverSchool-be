name: Auto Deploy BE Binary to VPS (staging)

on:
  push:
    branches:
      - staging

concurrency:
  group: be-auto-deploy-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build Linux binary
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o cleverschool-be .

      - name: Package release bundle
        id: bundle
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          RELEASE_DIR="release-$SHORT_SHA"
          mkdir -p "$RELEASE_DIR"
          cp cleverschool-be "$RELEASE_DIR/myapp"
          cp -R database templates power_point i18n "$RELEASE_DIR/"
          tar -czf "cleverschool-be-$SHORT_SHA.tar.gz" -C "$RELEASE_DIR" .
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "bundle=cleverschool-be-$SHORT_SHA.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload release bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_STAGING_HOST }}
          username: ${{ secrets.VPS_STAGING_USER }}
          key: ${{ secrets.VPS_STAGING_SSH_KEY }}
          port: ${{ secrets.VPS_STAGING_PORT }}
          source: ${{ steps.bundle.outputs.bundle }}
          target: ${{ secrets.VPS_STAGING_APP_DIR }}

      - name: Deploy release on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_STAGING_HOST }}
          username: ${{ secrets.VPS_STAGING_USER }}
          key: ${{ secrets.VPS_STAGING_SSH_KEY }}
          port: ${{ secrets.VPS_STAGING_PORT }}
          script_stop: true
          script: |
            set -e
            SHORT_SHA=${{ steps.bundle.outputs.short_sha }}
            APP_DIR="${{ secrets.VPS_STAGING_APP_DIR }}"
            RELEASE_DIR="$APP_DIR/releases/$SHORT_SHA"
            BUNDLE="$APP_DIR/cleverschool-be-$SHORT_SHA.tar.gz"

            mkdir -p "$APP_DIR/releases" "$APP_DIR/current"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$BUNDLE" -C "$RELEASE_DIR"
            rm -f "$BUNDLE"
            ln -sfn "$RELEASE_DIR" "$APP_DIR/current"

            cd "$APP_DIR"
            docker compose up -d postgres redis

            until docker compose exec -T postgres pg_isready -U "${DB_MASTER_USER:-admin}" -d "${DB_MASTER_NAME:-clever_school}" >/dev/null 2>&1; do
              echo "Waiting for postgres..."
              sleep 3
            done

            if [ ! -f "$APP_DIR/.env" ]; then
              echo "Missing $APP_DIR/.env"
              exit 1
            fi

            if [ ! -f /etc/systemd/system/cleverschool-be-staging.service ]; then
              cat >/etc/systemd/system/cleverschool-be-staging.service <<'EOF'
[Unit]
Description=CleverSchool BE (staging)
After=network-online.target docker.service
Wants=network-online.target

[Service]
Type=simple
User=root
WorkingDirectory=/opt/cleverschool/staging/current
EnvironmentFile=/opt/cleverschool/staging/.env
ExecStart=/opt/cleverschool/staging/current/myapp
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
EOF
            fi

            systemctl daemon-reload
            systemctl enable cleverschool-be-staging.service
            systemctl restart cleverschool-be-staging.service
            systemctl --no-pager --full status cleverschool-be-staging.service || true