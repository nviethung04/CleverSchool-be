name: Auto Deploy BE to VPS (staging)

on:
  push:
    branches:
      - staging

concurrency:
  group: be-deploy-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Build Linux binary
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o myapp .

      - name: Package release bundle
        id: bundle
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          RELEASE_DIR="release-$SHORT_SHA"
          mkdir -p "$RELEASE_DIR"
          cp myapp "$RELEASE_DIR/"
          cp docker-compose.yml "$RELEASE_DIR/"
          # Bạn đảm bảo có các thư mục này trong source code, nếu không cp sẽ báo lỗi
          cp -R templates power_point i18n "$RELEASE_DIR/" || true
          tar -czf "cleverschool-be-$SHORT_SHA.tar.gz" -C "$RELEASE_DIR" .
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "bundle=cleverschool-be-$SHORT_SHA.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Debug SSH inputs
        run: |
          echo "USER=${{ secrets.VPS_STAGING_USER }}"
          echo "HOST=${{ secrets.VPS_STAGING_HOST }}"
          echo "PORT=${{ secrets.VPS_STAGING_PORT }}"
          if [ -n "${{ secrets.VPS_STAGING_SSH_KEY }}" ]; then
            echo "KEY=SET"
          else
            echo "KEY=EMPTY"
            exit 1
          fi

      - name: Upload release bundle to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_STAGING_HOST }}
          username: ${{ secrets.VPS_STAGING_USER }}
          key: ${{ secrets.VPS_STAGING_SSH_KEY }}
          port: ${{ secrets.VPS_STAGING_PORT }}
          source: ${{ steps.bundle.outputs.bundle }}
          target: ${{ secrets.VPS_STAGING_APP_DIR }}

      - name: Deploy release on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_STAGING_HOST }}
          username: ${{ secrets.VPS_STAGING_USER }}
          key: ${{ secrets.VPS_STAGING_SSH_KEY }}
          port: ${{ secrets.VPS_STAGING_PORT }}
          script_stop: true
          script: |
            set -e
            SHORT_SHA=${{ steps.bundle.outputs.short_sha }}
            APP_DIR="${{ secrets.VPS_STAGING_APP_DIR }}"
            RELEASE_DIR="$APP_DIR/releases/$SHORT_SHA"
            BUNDLE="$APP_DIR/cleverschool-be-$SHORT_SHA.tar.gz"

            if [ ! -f "$APP_DIR/.env" ]; then
              echo "Missing $APP_DIR/.env"
              exit 1
            fi

            mkdir -p "$APP_DIR/releases"
            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$BUNDLE" -C "$RELEASE_DIR"
            rm -f "$BUNDLE"
            
            # --- ĐÃ SỬA: Cấp quyền thực thi cho myapp ---
            chmod +x "$RELEASE_DIR/myapp"
            
            ln -sfn "$RELEASE_DIR" "$APP_DIR/current"

            cd "$APP_DIR/current"
            docker compose -p cleverschool-staging --env-file "$APP_DIR/.env" up -d postgres redis

            until docker compose -p cleverschool-staging --env-file "$APP_DIR/.env" exec -T postgres pg_isready -U "${DB_MASTER_USER:-admin}" -d "${DB_MASTER_NAME:-clever_school_staging}" >/dev/null 2>&1; do
              echo "Waiting for postgres..."
              sleep 3
            done

            set -a
            . "$APP_DIR/.env"
            set +a
            
            # Chạy migrate
            "$APP_DIR/current/myapp" migrate

            # --- ĐÃ SỬA: Dùng sudo sh -c để tránh lỗi Permission Denied và gán User động ---
            if [ ! -f /etc/systemd/system/cleverschool-be-staging.service ]; then
              sudo sh -c "printf '%s\n' \
                '[Unit]' \
                'Description=CleverSchool BE (staging)' \
                'After=network-online.target docker.service' \
                'Wants=network-online.target' \
                '' \
                '[Service]' \
                'Type=simple' \
                'User=${{ secrets.VPS_STAGING_USER }}' \
                'WorkingDirectory=$APP_DIR/current' \
                'EnvironmentFile=$APP_DIR/.env' \
                'ExecStart=$APP_DIR/current/myapp' \
                'Restart=always' \
                'RestartSec=5' \
                '' \
                '[Install]' \
                'WantedBy=multi-user.target' \
                > /etc/systemd/system/cleverschool-be-staging.service"
            fi

            # --- ĐÃ SỬA: Thêm sudo cho systemctl ---
            sudo systemctl daemon-reload
            sudo systemctl enable cleverschool-be-staging.service
            sudo systemctl restart cleverschool-be-staging.service
            sudo systemctl --no-pager --full status cleverschool-be-staging.service || true